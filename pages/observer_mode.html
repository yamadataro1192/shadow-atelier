<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>観測者モード</title>
<link rel="stylesheet" href="../style.css">
<script src="../script.js"></script>
</head>

<body>
<div class="container">
    <h1>観測者モード</h1>
    <p>観測者はひとりでいい。影は次を選ぶ。</p>

    <input id="obsInput" type="number" placeholder="あなたの影のずれを入力">
    <br><br>
    <button onclick="showObs()">観測する</button>

    <p id="obsResult" style="margin-top:40px;"></p>
</div>

<script>
function showObs() {
    const v = parseFloat(obsInput.value);
    document.getElementById("obsResult").innerText =
        `観測者の影のずれ：${v.toFixed(2)} units`;
}
</script>

</body>
</html>
