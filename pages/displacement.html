<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>影変位シミュレーション</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../script.js"></script>
</head>

<body>
<div class="container fade">

    <h1 class="title">影変位シミュレーション</h1>
    <p>影形ログ・角度・時刻を入力してください。</p>

    <textarea id="values" rows="5" placeholder="1.2&#10;1.4&#10;1.4&#10;1.7&#10;2.1"></textarea>
    <input id="angle" type="number" placeholder="角度（例：37）">
    <input id="time" type="number" placeholder="時刻（例：2341）">

    <button onclick="
        simulateDisplacement(
            document.getElementById('values').value.split('\n'),
            Number(document.getElementById('angle').value),
            Number(document.getElementById('time').value)
        )
    ">変位を再現する</button>

    <p id="dispResult" class="observer-result"></p>

    <br><br>
    <a id="observerLogLink" class="locked" href="observer_log.html">観測者ログへ進む</a>

    <br><br>
    <button onclick="goHome()">タイトルへ戻る</button>

</div>
</body>
</html>
